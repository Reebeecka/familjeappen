<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#557565" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Du är offline – Familjeappen</title>
    <style>
      :root {
        color: #302f2b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #faf7f2;
      }

      main {
        width: min(100%, 380px);
        padding: 2rem;
        text-align: center;
        background: #fffdf9;
        border: 1px solid #e4ddd3;
        border-radius: 18px;
        box-shadow: 0 4px 18px rgba(78, 68, 57, 0.08);
      }

      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }

      h1 {
        margin: 1.25rem 0 0.5rem;
        color: #557565;
        font-size: 1.6rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #6e6a63;
        line-height: 1.5;
      }

      button {
        padding: 0.75rem 1.1rem;
        color: #fff;
        font: inherit;
        font-weight: 600;
        background: #557565;
        border: 0;
        border-radius: 13px;
        cursor: pointer;
      }

      button:hover {
        background: #3f5d4e;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="88" height="88" />
      <h1>Du är offline</h1>
      <p>Familjeappen kan inte nå nätverket just nu. Kontrollera anslutningen och försök igen.</p>
      <button type="button" onclick="window.location.reload()">Försök igen</button>
    </main>
  </body>
</html>
